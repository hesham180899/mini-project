<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopt a Pet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 0;
            text-align: center;
        }
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            text-align: center;
        }
        nav ul li {
            display: inline;
            margin: 0 20px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }
        .form-container {
            width: 60%;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <header>
        <h1>Adopt Your New Best Friend!</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="adopt.html">Adopt a Pet</a></li>
        </ul>
    </nav>

    <main>
        <div class="form-container">
            <h2>Adoption Application</h2>
            <form action="#" method="POST">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Your Email</label>
                <input type="email" id="email" name="email" required>

                <label for="pet">Pet You Want to Adopt</label>
                <select id="pet" name="pet" required>
                    <option value="Buddy">Buddy (Labrador)</option>
                    <option value="Whiskers">Whiskers (Persian Cat)</option>
                    <option value="Max">Max (Beagle)</option>
                    <option value="Fluffy">Fluffy (Maine Coon)</option>
                </select>

                <label for="message">Why do you want to adopt this pet?</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <input type="submit" value="Submit Application">
            </form>
        </div>
    </main>

</body>
</html>
